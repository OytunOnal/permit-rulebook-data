name: check
on:
  push:
    branches: [master]
  pull_request:
  # The watch pushes its state with the workflow token, and a push made with
  # that token starts no workflow. So the watch's own commits are checked here,
  # after every run of it on master, whatever its conclusion: a run that
  # committed nothing can still leave master red, when the calendar turns a
  # test (#117, decision 8).
  workflow_run:
    workflows: [source-watch]
    types: [completed]
    branches: [master]

# The floor: reading the repository. Only the report job raises it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04 # named, never -latest: the browser cases drive the image's own Chrome, as the watch's do (#24)
    # It runs a pull request's own code, a stranger's included, so it holds
    # nothing it could write with.
    permissions:
      contents: read
    steps:
      # Master's head on a push and after a watch run, the pull request's own
      # head on a pull request (#117, decision 8).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run check
