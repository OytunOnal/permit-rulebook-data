name: source-watch
on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - name: Coverage gate (every dataset source is watched)
        run: node dist/src/watch/cli-coverage.js

      # continue-on-error so detected changes/flags/state are NEVER discarded
      # because one source was unreachable; the final gate re-raises the red.
      - name: Watch sources
        id: watch
        continue-on-error: true
        run: node dist/src/watch/cli-watch.js --commit

      - name: Collect NEW flags (only files this run created)
        id: newflags
        run: |
          {
            echo "files<<EOF"
            git status --porcelain watch/flags | awk '{print $2}'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Persist state + flags BEFORE issue creation (nothing depends on gh succeeding)
        id: persist
        run: |
          # GitHub maps a `<login>@users.noreply.github.com` address to whichever
          # account owns that login, and the login "watch" belongs to a stranger:
          # every commit this bot made was displayed as that person's. The
          # canonical github-actions[bot] identity is the only address that
          # attributes automated commits to the automation (2026-09-08).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch/state.json watch/flags || true
          # Whether a commit actually happened is what the site needs to know, so
          # it is recorded rather than inferred: only a real state change is
          # worth waking the site's build for.
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "watch: state update $(date -u +%F)"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
          git push

      # The site bakes "RULES READ <date>" and promises "checked daily", but it
      # rebuilds only on its own pushes and its own cron. A new state committed
      # here is exactly the moment that promise needs honouring, so we tell the
      # site directly instead of leaving it to tomorrow's schedule (2026-09-08).
      #
      # DISPATCH_TOKEN is a fine-grained personal access token whose resource
      # owner is OytunOnal, scoped to the SITE repository (OytunOnal/permit-rulebook)
      # alone, with repository permissions "Metadata: Read-only" (mandatory for
      # every fine-grained token) and "Contents: Read and write" — the dispatch
      # endpoint is filed under Contents, and read-only is refused with a 403.
      # It needs nothing else: no access to this repository, no organisation or
      # account permissions. Store it as a repository secret named
      # DISPATCH_TOKEN in THIS repository. See CONTRIBUTING.md, "The daily watch
      # and the site rebuild".
      #
      # The step fails loudly when the secret is missing rather than skipping:
      # a silent skip is how "checked daily" quietly stops being true.
      - name: Tell the site to rebuild
        if: steps.persist.outputs.committed == 'true'
        env:
          DISPATCH_TOKEN: "${{ secrets.DISPATCH_TOKEN }}"
          SITE_REPO: "${{ vars.SITE_REPO || 'OytunOnal/permit-rulebook' }}"
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::DISPATCH_TOKEN is not set. The watch committed new state but the site cannot be told to rebuild, so its \"RULES READ\" date will go stale. Create a fine-grained PAT scoped to $SITE_REPO with Metadata: Read-only and Contents: Read and write, then add it to this repository as a secret named DISPATCH_TOKEN (Settings -> Secrets and variables -> Actions). See CONTRIBUTING.md, \"The daily watch and the site rebuild\"."
            exit 1
          fi
          # The dispatch endpoint takes the event type the site listens for; the
          # payload is there for a human reading the site's run, not for the build.
          payload=$(printf '{"event_type":"dataset-updated","client_payload":{"sha":"%s","reason":"watch state update"}}' "$GITHUB_SHA")
          curl --fail-with-body --silent --show-error -X POST "https://api.github.com/repos/$SITE_REPO/dispatches" -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $DISPATCH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$payload"

      - name: Open issues for new flags only
        if: steps.newflags.outputs.files != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh label create source-change --color e4a11b --description "A watched official source changed" --force
          failed=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            title=$(head -n1 "$f" | sed 's/^# //')
            gh issue create --title "$title" --body-file "$f" --label source-change || failed=1
          done <<< "${{ steps.newflags.outputs.files }}"
          exit $failed

      - name: Fail the run if any source was unreachable
        if: steps.watch.outcome == 'failure'
        run: |
          echo "::error::watch reported unreachable sources — see the Watch sources step"
          exit 1
