name: source-watch
on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  # Two switches, and both default to what the daily run already does. They
  # exist because s34 needed the watch dispatched for two reasons that are not
  # "read the sources and record it" (2026-09-23):
  #
  #   commit=false    a MEASUREMENT run. Point 6 asks what seven browser reads
  #                   cost on this runner, before and after. A run that answers
  #                   that question must leave nothing behind — no new state,
  #                   no push, no issue — or the measurement has edited the
  #                   thing it was measuring.
  #   dispatch=false  a BASELINE run on a BRANCH. The last step tells the site
  #                   to rebuild against the commit this job just pushed, and
  #                   the site pins whatever it is told. Pointing it at an
  #                   unmerged branch commit would pin the live site to data
  #                   that is not on master.
  #
  # **The schedule's path is byte-for-byte what it was.** Every switch below is
  # written `github.event.inputs.X != 'false'`, and on a `schedule` event
  # `github.event.inputs` is null — so every one of them is true, exactly as if
  # the inputs did not exist. The test is deliberately against the STRING
  # 'false' and not against the boolean: a `type: boolean` input still arrives
  # in `github.event.inputs` as a string, and `inputs.X == false` would be TRUE
  # for the schedule's empty value — which is the silent way to stop the daily
  # run ever committing again.
  workflow_dispatch:
    inputs:
      commit:
        description: "Persist the new state, push it, and file issues for new flags"
        type: boolean
        default: true
      dispatch:
        description: "Tell the site to rebuild against the pushed commit"
        type: boolean
        default: true

# The floor: reading the repository. The watch job raises it, because it is the
# one that commits a new state and files an issue when a source moves (Spine
# steward-40, 2026-09-08).
permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-26.04 # named, never -latest: the image changes only when this file does, and the browser tier reads the image's own Chrome (#24)
    permissions:
      # Commits watch/state.json and the flag files.
      contents: write
      # Opens one issue per new flag, one when the run itself fails, and one
      # naming the flags no person has walked in two days.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with: { node-version: 22 }
      - run: npm ci

      # Every installed dependency, dev ones included: the test runner runs in
      # this job, which holds a write token. A known advisory at high or above
      # turns the run red — at the end, through "Fail the run on a known
      # advisory" — and stops nothing: the sources are still read and recorded
      # (#47).
      - name: Audit the installed dependencies
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - run: npm run build
      - name: Coverage gate (every dataset source is watched)
        run: node dist/src/watch/cli-coverage.js

      # Seven entries are read by opening them in a browser, and a run that
      # cannot open one has not read them — it reports them unreachable and
      # goes red, which is right and is also indistinguishable, in the log,
      # from seven pages that went down. So the browser is named before the
      # run: one line that turns "unreachable" into a diagnosis (s34).
      - name: Say which Chrome the watch will use
        run: node -e "import('./dist/src/watch/browser.js').then(m => console.log(m.chromePath()))"

      # continue-on-error so detected changes/flags/state are NEVER discarded
      # because one source was unreachable; the final gate re-raises the red.
      - name: Watch sources
        id: watch
        continue-on-error: true
        env:
          # The expression resolves to one of two literals — `--commit`, or
          # nothing — never to the input itself, so what reaches the command
          # line is this file's own word and not the dispatcher's.
          COMMIT_FLAG: ${{ github.event.inputs.commit != 'false' && '--commit' || '' }}
        run: node dist/src/watch/cli-watch.js $COMMIT_FLAG

      # Files, and only files. `git status --porcelain watch/flags` printed the
      # DIRECTORY when it was untracked, `head -n1` was handed a directory, and
      # the step died — twice, on 09-03 and 09-05, with no issue filed for the
      # flags those runs had just written (devils-advocate, 2026-09-08). The
      # pathspec below can only match a markdown file, and the field is taken
      # with `cut` rather than `awk '{print $2}'`, which loses a renamed path.
      # The three steps that WRITE — to disk, to the remote, to the issue
      # tracker — are the three a measurement run must not take. Guarded one by
      # one rather than by a single early exit, so a reader of the log sees
      # each of them skipped and knows the run left nothing behind.
      - name: Collect NEW flags (only files this run created)
        id: newflags
        if: github.event.inputs.commit != 'false'
        run: |
          {
            echo "files<<EOF"
            git status --porcelain -- 'watch/flags/*.md' | cut -c4- | sed 's/^.* -> //'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Persist state + flags BEFORE issue creation (nothing depends on gh succeeding)
        id: persist
        if: github.event.inputs.commit != 'false'
        run: |
          # GitHub maps a `<login>@users.noreply.github.com` address to whichever
          # account owns that login, and the login "watch" belongs to a stranger:
          # every commit this bot made was displayed as that person's. The
          # canonical github-actions[bot] identity is the only address that
          # attributes automated commits to the automation (2026-09-08).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch/state.json watch/flags || true
          # Whether a commit actually happened is what the site needs to know, so
          # it is recorded rather than inferred: only a real state change is
          # worth waking the site's build for.
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "watch: state update $(date -u +%F)"
            echo "committed=true" >> "$GITHUB_OUTPUT"
            # The commit this run just made — not the one it started from. The
            # site pins the data commit it builds against, and dispatching
            # $GITHUB_SHA would walk that lock backwards to before this state
            # existed (Security review, 2026-09-08).
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          git push

      - name: Open issues for new flags only
        # Both halves: the flag list is empty on a day nothing moved, and the
        # step that produces it did not run at all on a measurement dispatch.
        if: github.event.inputs.commit != 'false' && steps.newflags.outputs.files != ''
        env:
          GH_TOKEN: "${{ github.token }}"
          # Through the environment, never interpolated into the script body: a
          # file name is data, and data in a shell is a command waiting to
          # happen (Security review, 2026-09-08).
          FLAGS: "${{ steps.newflags.outputs.files }}"
        run: |
          gh label create source-change --color e4a11b --description "A watched official source changed" --force
          failed=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Only a flag file this repository wrote, and only one that exists.
            case "$f" in watch/flags/*.md) ;; *) echo "::error::refusing $f"; failed=1; continue ;; esac
            [ -f "$f" ] || { echo "::error::$f is not a file"; failed=1; continue; }
            title=$(head -n1 "$f" | sed 's/^# //')
            gh issue create --title "$title" --body-file "$f" --label source-change || failed=1
          done <<< "$FLAGS"
          exit $failed

      # The clock on a flag (#62). A flag no person has walked by the second
      # morning after the day it was raised turns the morning red, as a refusal
      # by us does, and is named in one issue, `overdue flags`; every open
      # `source-change` flag counts, a due reminder as much as a detected change.
      #
      # The clock's exit codes are its own (src/watch/cli-overdue.ts). Anything
      # but clear or overdue is this step failing — the check did not finish,
      # so `watch run failed` says so and `overdue flags` is left as it was —
      # and the error names which half did not: the tracker, or the clock.
      # Exit 1 counts as overdue only with a body to file: a clock that never
      # ran (a failed build ends here) exits 1 too.
      #
      # A measurement run reads no clock. It leaves nothing behind, and an open
      # flag says nothing about what it was dispatched to measure.
      - name: Read the clock on open flags
        id: clock
        if: ${{ !cancelled() && github.event.inputs.commit != 'false' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if ! gh issue list --label source-change --state open --json number,title,createdAt --limit 1000 > "$RUNNER_TEMP/open-flags.json"; then
            echo "::error::the tracker's open flags could not be read, so this morning nobody knows whether a flag is overdue"
            exit 1
          fi
          status=0
          node dist/src/watch/cli-overdue.js < "$RUNNER_TEMP/open-flags.json" > "$RUNNER_TEMP/overdue.md" || status=$?
          if [ "$status" = 0 ]; then
            echo "reading=clear" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 1 ] && [ -s "$RUNNER_TEMP/overdue.md" ]; then
            echo "reading=overdue" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 2 ]; then
            echo "::error::the tracker answered, and the clock could not read its answer — its log line says what was wrong with it"
            exit 1
          else
            echo "::error::the clock did not run to its end (exit $status), so this morning nobody knows whether a flag is overdue"
            exit 1
          fi

      # One issue for the clock, never `source-change` (metric 1 counts that
      # label, and this issue would count itself). It is the run's to keep: a
      # red morning comments on it, reopening it if it was closed, and the first
      # morning with nothing overdue says so and closes it — what it says is the
      # tracker's own state, so leaving it to a person to close would be one
      # more thing for nobody to read.
      - name: Say which flags are overdue
        if: ${{ !cancelled() && (steps.clock.outputs.reading == 'overdue' || steps.clock.outputs.reading == 'clear') }}
        env:
          GH_TOKEN: "${{ github.token }}"
          READING: "${{ steps.clock.outputs.reading }}"
          TITLE: overdue flags
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          # The exact title, open or closed: a search matches words, not titles.
          found=$(gh issue list --label watch --state all --search "$TITLE in:title" --json number,state,title --jq 'map(select(.title == env.TITLE)) | first // empty | "\(.number) \(.state)"')
          number=${found%% *}
          state=${found#* }
          if [ "$READING" = overdue ]; then
            gh label create watch --color b60205 --description "The daily source watch itself" --force
            printf '\nRun: %s\n' "$RUN_URL" >> "$RUNNER_TEMP/overdue.md"
            if [ -z "$found" ]; then
              gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/overdue.md" --label watch
            else
              if [ "$state" = CLOSED ]; then gh issue reopen "$number"; fi
              gh issue comment "$number" --body-file "$RUNNER_TEMP/overdue.md"
            fi
          elif [ -n "$found" ] && [ "$state" = OPEN ]; then
            gh issue close "$number" --comment "No overdue flag this morning. Run: $RUN_URL"
          fi

      - name: Fail the run if any source was unreachable
        if: steps.watch.outcome == 'failure'
        run: |
          echo "::error::watch reported unreachable sources — see the Watch sources step"
          exit 1

      # Behind every step that does the watch's work, so a red audit skips
      # none of it; `!cancelled()` so an unreachable source above does not
      # hide it.
      - name: Fail the run on a known advisory
        if: ${{ !cancelled() && steps.audit.outcome == 'failure' }}
        run: |
          echo "::error::npm audit found a known advisory at high or above — see the Audit the installed dependencies step"
          exit 1

      # The site bakes "RULES READ <date>" and promises "checked daily", but it
      # rebuilds only on its own pushes and its own cron. A new state committed
      # here is exactly the moment that promise needs honouring, so we tell the
      # site directly instead of leaving it to tomorrow's schedule (2026-09-08).
      #
      # DISPATCH_TOKEN is a fine-grained personal access token whose resource
      # owner is OytunOnal, scoped to the SITE repository (OytunOnal/permit-rulebook)
      # alone, with repository permissions "Metadata: Read-only" (mandatory for
      # every fine-grained token) and "Contents: Read and write" — the dispatch
      # endpoint is filed under Contents, and read-only is refused with a 403.
      # It needs nothing else: no access to this repository, no organisation or
      # account permissions. Store it as a repository secret named
      # DISPATCH_TOKEN in THIS repository. See CONTRIBUTING.md, "The daily watch
      # and the site rebuild".
      #
      # The step fails loudly when the secret is missing rather than skipping:
      # a silent skip is how "checked daily" quietly stops being true.
      - name: Tell the site to rebuild
        # Last step in the job, and it runs even after an earlier one failed:
        # the flags and their issues must never be behind a step that can
        # fail on a missing secret (review 2026-09-08), and a state that WAS
        # committed still has to reach the site when some other source was
        # unreachable. Cancellation is the one case that stands it down.
        #
        # And only from master. The input is a switch a person can forget; the
        # ref is not. A `workflow_dispatch` on a BRANCH with commit=true pushes
        # state to that branch and would then tell the site to pin it — and the
        # site's handler checks only that the sha is forty hex characters
        # before it deploys and writes it into `data.lock`. This slice's own
        # baseline runs were one untouched input away from pinning the live
        # site to data that was not on master (Security review, 2026-09-24).
        # The schedule runs on master, so the daily path is unchanged.
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' && github.event.inputs.dispatch != 'false' && steps.persist.outputs.committed == 'true' }}
        env:
          DISPATCH_TOKEN: "${{ secrets.DISPATCH_TOKEN }}"
          SITE_REPO: "${{ vars.SITE_REPO || 'OytunOnal/permit-rulebook' }}"
          # The commit the persist step pushed, through the environment rather
          # than interpolated into the script body.
          STATE_SHA: "${{ steps.persist.outputs.sha }}"
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::DISPATCH_TOKEN is not set. The watch committed new state but the site cannot be told to rebuild, so its \"RULES READ\" date will go stale. Create a fine-grained PAT scoped to $SITE_REPO with Metadata: Read-only and Contents: Read and write, then add it to this repository as a secret named DISPATCH_TOKEN (Settings -> Secrets and variables -> Actions). See CONTRIBUTING.md, \"The daily watch and the site rebuild\"."
            exit 1
          fi
          # The dispatch endpoint takes the event type the site listens for; the
          # payload is there for a human reading the site's run, not for the build.
          payload=$(printf '{"event_type":"dataset-updated","client_payload":{"sha":"%s","reason":"watch state update"}}' "$STATE_SHA")
          curl --fail-with-body --silent --show-error -X POST "https://api.github.com/repos/$SITE_REPO/dispatches" -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $DISPATCH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "$payload"

      # A red run that nobody sees is a watch that has stopped. One issue,
      # reopened and updated rather than duplicated, with the link to the run
      # (devils-advocate, 2026-09-08: three failed runs went unnoticed).
      - name: Say so when the run fails
        # Last, and after the dispatch: an expired DISPATCH_TOKEN fails that
        # step, and the run that noticed it must still say so (Standards
        # review, 2026-09-08).
        #
        # The fourth thing a measurement run must not do is file this. Nobody
        # is waiting on a hand-dispatched measurement the way they wait on the
        # morning's run, and "watch run failed" in the tracker reads as the
        # daily watch having stopped — which is exactly the alarm this issue
        # exists to raise, spent on a run that was never going to record
        # anything (s34, 2026-09-23). The person who dispatched it is looking
        # at the run.
        if: failure() && github.event.inputs.commit != 'false'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh label create watch --color b60205 --description "The daily source watch itself" --force
          title="watch run failed"
          body="The daily watch failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}
          Nothing here says a source changed — it says the check did not finish, or the audit found a known advisory; the failed step in the run says which."
          existing=$(gh issue list --label watch --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label watch
          fi

      # Last, after `watch run failed` has decided whether to speak. An overdue
      # flag turns the run red, but it is not the check failing, and
      # `failure()` cannot tell one red step from another; behind it, this step
      # reddens the run without filing anything `overdue flags` did not say.
      - name: Fail the run on an overdue flag
        if: ${{ !cancelled() && steps.clock.outputs.reading == 'overdue' }}
        run: |
          echo "::error::a flag no person has walked is two days old or more — see the issue overdue flags"
          exit 1
